[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ipcam"
version = "0.1.0"
description = "Low-latency Hikvision RTSP/ISAPI streaming and hardware integration layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "av>=12.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "scipy>=1.10",
]

[project.optional-dependencies]
display = ["opencv-python>=4.8"]
nvdec = ["PyNvVideoCodec>=1.0", "torch>=2.2"]
fusion = ["faiss-cpu>=1.8", "onnxruntime>=1.17", "nats-py>=2.6", "opencv-python-headless>=4.8"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "opencv-python-headless>=4.8", "faiss-cpu>=1.8", "protobuf>=4.25"]

[tool.hatch.build.targets.wheel]
packages = ["ipcam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
